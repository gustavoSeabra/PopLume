version: '3.8'

services:
  db:
    container_name: postgres-poplume
    image: "postgres"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Password1"
      POSTGRES_DB: PopLume
    ports:
      - 5432:5432
  poplume-api:
    container_name: poplume-api
    build:
      context: .
      dockerfile: "./docker/dockerfile-poplumeapi"
    depends_on:
      - db
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PopLumeApi: Host=db;Port=5432;Database=PopLume;Username=postgres;Password=Password1
    ports:
      - "8081:8080"

  poplume-app:
    container_name: poplume-app
    build:
      context: .
      dockerfile: "./docker/dockerfile-poplumeweb"
    depends_on:
      - poplume-api
    restart: always
    ports:
      - "8080:4000"